# nginx config for the Potfolio single-page app.
# Serves the Vite build from /usr/share/nginx/html with SPA fallback,
# gzip compression, long-lived caching for hashed assets, and security headers.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- Gzip ----------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml application/json
        application/javascript application/rss+xml application/atom+xml
        image/svg+xml font/woff font/woff2;

    # --- Security headers ----------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # --- Hashed Vite assets: immutable, cache for a year ---------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # --- Static files that change rarely -------------------------------------
    location ~* \.(?:webp|png|jpg|jpeg|gif|svg|ico|pdf)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # --- Everything else: SPA fallback, never cached --------------------------
    location / {
        expires -1;
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }
}
